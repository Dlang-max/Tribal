[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tribal"
version = "0.1.0"
description = "Basic local knowledge-base MCP server for Tribal"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
tribal-mcp-server = "server:main"

[tool.setuptools]
package-dir = { "" = "src/tribal-mcp-server/src" }
py-modules = ["server"]

[tool.ruff]
line-length = 100
