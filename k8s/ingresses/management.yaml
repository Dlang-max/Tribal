apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tribal-management
  namespace: tribal
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tribal-management
                port:
                  number: 8000
