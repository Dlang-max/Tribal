apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
# The default KinD CNI may not enforce NetworkPolicies; these rules document
# intended boundaries and do not claim isolation unless the chosen CNI enforces them.
# TCP/443 permits GitHub OAuth/API calls; DNS resolution needs UDP/TCP 53.
metadata:
  name: tribal-project-workers
  namespace: tribal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tribal-project-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
