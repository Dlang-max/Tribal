apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: tribal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.7.17
          args:
            - --ping=true
            - --entrypoints.web.address=:8000
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=tribal
            - --providers.kubernetesingress.ingressclass=traefik
            - --providers.kubernetesingress.disableclusterscoperesources=true
            - --providers.kubernetesingress.allowemptyservices=false
            - --log.level=INFO
            - --accesslog=true
          ports:
            - name: web
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /ping
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
