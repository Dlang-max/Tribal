apiVersion: apps/v1
kind: Deployment
metadata:
  name: tribal-management
  namespace: tribal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tribal-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tribal-management
    spec:
      serviceAccountName: tribal-management
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: management
          image: tribal-mcp-demo:local
          imagePullPolicy: Never
          command: ["python", "-m", "tribal"]
          args: ["management"]
          envFrom:
            - configMapRef:
                name: tribal-management
          env:
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tribal-github-oauth
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tribal-github-oauth
                  key: GITHUB_CLIENT_SECRET
            - name: TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: tribal-management-auth
                  key: TOKEN_SIGNING_KEY
            - name: SESSION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: tribal-management-auth
                  key: SESSION_SIGNING_KEY
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tribal-management-data
