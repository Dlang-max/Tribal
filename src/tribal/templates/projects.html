<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{csrf_token}}">
  <title>Tribal projects</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #17231f; background: #f3f6f3; }
    body { max-width: 850px; margin: 0 auto; padding: 2.5rem 1.25rem; }
    header, .project { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    header { margin-bottom: 2rem; }
    h1 { margin: 0; font-size: 1.8rem; }
    h2 { font-size: 1.15rem; }
    .panel, .project { background: white; border: 1px solid #dce5df; border-radius: 12px; padding: 1rem 1.25rem; }
    .panel { margin-bottom: 1.5rem; }
    form { display: flex; flex-wrap: wrap; gap: .75rem; }
    label { width: 100%; font-weight: 600; }
    input { flex: 1 1 16rem; min-width: 0; padding: .65rem .75rem; border: 1px solid #9baea3; border-radius: 6px; font: inherit; }
    button, .button { display: inline-block; padding: .65rem 1rem; border: 0; border-radius: 6px; background: #176b50; color: white; font: inherit; text-decoration: none; cursor: pointer; }
    .project-list { display: grid; gap: .75rem; padding: 0; list-style: none; }
    .project h3 { margin: 0; }
    .project p { margin: .2rem 0; color: #4b5e54; overflow-wrap: anywhere; }
    .status { font-size: .9rem; font-weight: 700; }
    .error, #form-message { color: #9b2929; }
    #form-message { min-height: 1.5em; }
    @media (max-width: 560px) { .project { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body data-signed-in="{{signed_in}}">
  <header>
    <div><h1>Tribal projects</h1><p>GitHub-authenticated context servers for your projects.</p></div>
    <div id="account"><span id="account-name">{{github_login}}</span></div>
  </header>
  <main id="management" hidden>
    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a project</h2>
      <form id="create-form">
        <label for="project-name">Project name</label>
        <input id="project-name" name="name" maxlength="100" required autocomplete="off">
        <button type="submit">Create project</button>
      </form>
      <p id="form-message" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="projects-heading">
      <h2 id="projects-heading">Your projects</h2>
      <ul id="project-list" class="project-list"></ul>
      <p id="empty-message">No projects yet.</p>
    </section>
  </main>
  <script>
    (() => {
      const signedIn = document.body.dataset.signedIn === 'true';
      const account = document.getElementById('account');
      if (!signedIn) {
        account.innerHTML = '<a class="button" href="/auth/login">Sign in with GitHub</a>';
        return;
      }
      document.getElementById('management').hidden = false;
      const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
      const list = document.getElementById('project-list');
      const empty = document.getElementById('empty-message');
      const message = document.getElementById('form-message');
      const form = document.getElementById('create-form');
      const statusNames = { provisioning: 'Provisioning', ready: 'Ready', failed: 'Failed' };

      const element = (tag, text, className) => {
        const node = document.createElement(tag);
        node.textContent = text || '';
        if (className) node.className = className;
        return node;
      };
      const render = projects => {
        list.replaceChildren();
        empty.hidden = projects.length > 0;
        for (const project of projects) {
          const item = element('li', '', 'project');
          const info = document.createElement('div');
          info.append(element('h3', project.name));
          info.append(element('p', project.mcp_url));
          if (project.error) info.append(element('p', project.error, 'error'));
          item.append(info);
          const state = element('span', statusNames[project.status] || project.status, 'status');
          item.append(state);
          list.append(item);
        }
      };
      const loadProjects = async () => {
        const response = await fetch('/api/projects', { headers: { 'Accept': 'application/json' } });
        if (!response.ok) throw new Error('Could not load projects. Refresh the page to retry.');
        render((await response.json()).projects);
      };
      const accountName = document.getElementById('account-name');
      if (accountName.textContent) accountName.textContent = 'Signed in as ' + accountName.textContent;
      account.append(document.createTextNode(' '));
      const logout = element('button', 'Sign out');
      logout.type = 'button';
      logout.addEventListener('click', async () => {
        await fetch('/auth/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } });
        window.location.reload();
      });
      account.append(logout);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        message.textContent = '';
        const name = new FormData(form).get('name');
        try {
          const response = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
            body: JSON.stringify({ name })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || 'Project creation failed.');
          form.reset();
          message.textContent = 'Project queued for provisioning.';
          await loadProjects();
        } catch (error) {
          message.textContent = error.message;
        }
      });
      loadProjects().catch(error => { message.textContent = error.message; });
      window.setInterval(() => loadProjects().catch(() => {}), 5000);
    })();
  </script>
</body>
</html>
